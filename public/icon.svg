<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#030712" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" rx="100" fill="#030712"/>
  
  <!-- Subtle Outer Hexagon Wireframe -->
  <polygon points="256,40 443,148 443,364 256,472 69,364 69,148" fill="none" stroke="#0891b2" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 15"/>

  <!-- Calibrated Compass Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.75" stroke-dasharray="60 30 15 30"/>

  <!-- Rotating Stator Coils -->
  <g transform="rotate(15 256 256)">
    <circle cx="256" cy="256" r="145" fill="none" stroke="#0284c7" stroke-width="14" stroke-opacity="0.3"/>
    <circle cx="256" cy="256" r="145" fill="none" stroke="#22d3ee" stroke-width="12" stroke-dasharray="20 40" filter="url(#glow)"/>
  </g>

  <!-- Inner Triangular Stator Brackets -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="25 15"/>

  <!-- Plasma Core Singularity -->
  <circle cx="256" cy="256" r="85" fill="url(#reactorGlow)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="32" fill="#ffffff" filter="url(#glow)"/>

  <!-- Cardinal Reticle Crosshairs -->
  <line x1="206" y1="256" x2="236" y2="256" stroke="#ffffff" stroke-width="3"/>
  <line x1="276" y1="256" x2="306" y2="256" stroke="#ffffff" stroke-width="3"/>
  <line x1="256" y1="206" x2="256" y2="236" stroke="#ffffff" stroke-width="3"/>
  <line x1="256" y1="276" x2="256" y2="306" stroke="#ffffff" stroke-width="3"/>

  <!-- Holographic Target Notches -->
  <path d="M 230,190 L 256,170 L 282,190" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 230,322 L 256,342 L 282,322" fill="none" stroke="#38bdf8" stroke-width="3"/>
</svg>
